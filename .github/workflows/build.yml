name: build

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
    branches: [main]

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build arm64 image
        run: docker build --platform linux/arm64 -t iox_aarch64_gps:latest .
      - name: Python import smoke test
        run: |
          docker run --rm --platform linux/arm64 iox_aarch64_gps:latest \
            python3 -c "import paho.mqtt.client, pynmea2, requests; print('ok')"
